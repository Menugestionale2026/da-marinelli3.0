<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marinelli 3.0 · Menù</title>
<meta name="description" content="Menù digitale di Marinelli 3.0 – Paninoteca: antipasti e panini dal sapore napoletano.">
<meta name="theme-color" content="#0b0710">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0710;
    --black-2:#140c1c;
    --purple:#6b2fa3;
    --purple-deep:#3a1460;
    --purple-soft:#a77bd6;
    --gold:#d4af37;
    --gold-light:#f3d98b;
    --text:#ece6f3;
    --muted:#b3a7c2;
    --line:rgba(212,175,55,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Outfit",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(107,47,163,.45), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(58,20,96,.55), transparent 60%),
      var(--black);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HEADER ---------- */
  header{
    text-align:center;
    padding:56px 20px 34px;
    position:relative;
  }
  .crown{
    width:46px;height:46px;margin:0 auto 14px;display:block;
    filter:drop-shadow(0 0 12px rgba(212,175,55,.45));
  }
  h1{
    font-family:"Cinzel",serif;
    font-weight:800;
    font-size:clamp(2.4rem,9vw,4.2rem);
    letter-spacing:.04em;
    line-height:1;
    background:linear-gradient(180deg,var(--gold-light) 0%,var(--gold) 55%,#9c7a1c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1 .ver{
    display:inline-block;
    font-size:.45em;
    vertical-align:super;
    margin-left:.15em;
    padding:.15em .45em;
    border:1.5px solid var(--gold);
    border-radius:999px;
    -webkit-text-fill-color:var(--gold-light);
    background:rgba(107,47,163,.35);
  }
  .tagline{
    margin-top:14px;
    font-size:.8rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--purple-soft);
  }
  .divider{
    display:flex;align-items:center;gap:12px;
    max-width:260px;margin:22px auto 0;color:var(--gold);
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  /* ---------- NAV ---------- */
  nav{
    position:sticky;top:0;z-index:10;
    display:flex;justify-content:center;gap:10px;
    padding:12px 16px;
    background:rgba(11,7,16,.82);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav a{
    font-family:"Cinzel",serif;font-weight:600;
    font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;
    text-decoration:none;color:var(--muted);
    padding:9px 20px;border-radius:999px;
    border:1px solid transparent;
    transition:all .25s;
  }
  nav a.active,nav a:hover{
    color:var(--black);
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    border-color:var(--gold);
  }

  /* ---------- SECTIONS ---------- */
  main{max-width:880px;margin:0 auto;padding:10px 16px 40px}
  section{padding-top:38px;scroll-margin-top:64px}
  .section-title{
    text-align:center;margin-bottom:26px;
  }
  .section-title small{
    display:block;font-size:.72rem;letter-spacing:.4em;
    text-transform:uppercase;color:var(--purple-soft);margin-bottom:6px;
  }
  .section-title h2{
    font-family:"Cinzel",serif;font-weight:800;
    font-size:clamp(1.7rem,6vw,2.3rem);
    color:var(--gold);letter-spacing:.06em;
  }

  .grid{display:grid;gap:14px}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}

  .card{
    position:relative;
    padding:20px 20px 18px;
    border-radius:18px;
    background:linear-gradient(160deg,rgba(58,20,96,.55),rgba(20,12,28,.92) 70%);
    border:1px solid var(--line);
    overflow:hidden;
    transition:transform .25s,border-color .25s,box-shadow .25s;
  }
  .card::before{
    content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;
    border-radius:0 3px 3px 0;
    background:linear-gradient(180deg,var(--gold),var(--purple));
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:rgba(212,175,55,.55);
    box-shadow:0 10px 30px -12px rgba(107,47,163,.7);
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    margin-bottom:10px;
  }
  .card h3{
    font-family:"Cinzel",serif;font-weight:600;
    font-size:1.15rem;letter-spacing:.03em;color:var(--gold-light);
  }
  .price{
    flex-shrink:0;
    font-weight:600;font-size:1rem;
    color:var(--black);
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    padding:4px 12px;border-radius:999px;
    box-shadow:0 0 0 3px rgba(212,175,55,.15);
  }
  .ingredients{
    list-style:none;
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .ingredients li{
    font-size:.86rem;font-weight:300;
    color:var(--text);
    padding:4px 10px;border-radius:8px;
    background:rgba(107,47,163,.28);
    border:1px solid rgba(167,123,214,.22);
  }

  /* ---------- EXTRAS ---------- */
  .extras{
    margin-top:26px;
    padding:20px;
    border-radius:18px;
    border:1px dashed rgba(212,175,55,.5);
    background:rgba(20,12,28,.7);
    text-align:center;
  }
  .extras h3{
    font-family:"Cinzel",serif;color:var(--gold);
    letter-spacing:.1em;margin-bottom:12px;
  }
  .extras p{color:var(--muted);margin:6px 0}
  .extras strong{color:var(--gold-light);font-weight:600}

  .card.off{opacity:.5}
  .card.off .price{background:#3a3340;color:var(--muted);box-shadow:none}
  .desc{margin-top:10px;font-size:.88rem;font-weight:300;color:var(--muted)}
  .loading{text-align:center;color:var(--muted);padding:60px 0}
  footer{
    text-align:center;padding:30px 16px 46px;
    color:var(--muted);font-size:.78rem;letter-spacing:.08em;
    border-top:1px solid var(--line);
    max-width:880px;margin:0 auto;
  }
  footer .brand{
    font-family:"Cinzel",serif;color:var(--gold);font-size:1rem;
    letter-spacing:.15em;display:block;margin-bottom:6px;
  }
</style>
</head>
<body>

<header>
  <svg class="crown" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f3d98b"/><stop offset="1" stop-color="#b8901f"/>
      </linearGradient>
    </defs>
    <path d="M8 46 L12 18 L24 32 L32 12 L40 32 L52 18 L56 46 Z" fill="url(#g)"/>
    <rect x="8" y="48" width="48" height="6" rx="2" fill="url(#g)"/>
    <circle cx="32" cy="36" r="4" fill="#6b2fa3"/>
  </svg>
  <h1 id="nome">Marinelli<span class="ver">3.0</span></h1>
  <p class="tagline" id="sottotitolo">Paninoteca · Sapori di Napoli</p>
  <div class="divider">✦</div>
</header>

<nav id="nav"></nav>

<main id="menu"><p class="loading">Caricamento menù…</p></main>

<footer>
  <span class="brand" id="brand">MARINELLI 3.0</span>
  <span id="nota"></span>
</footer>

<script>
/* Il menù si modifica dal pannello /admin (oppure nel file menu.json). */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const euro = p => {
  const n = Number(p);
  if (!isFinite(n)) return esc(p);
  return (Number.isInteger(n) ? n : n.toFixed(2).replace(".", ",")) + " €";
};
const slug = (t, i) => (String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "sezione") + "-" + i;

function render(m) {
  document.title = `${m.nome} ${m.versione || ""} · Menù`.replace(/\s+/g, " ");
  document.getElementById("nome").innerHTML = esc(m.nome) + (m.versione ? `<span class="ver">${esc(m.versione)}</span>` : "");
  document.getElementById("sottotitolo").textContent = m.sottotitolo || "";
  document.getElementById("brand").textContent = `${m.nome} ${m.versione || ""}`.toUpperCase();
  document.getElementById("nota").textContent = m.notaPiePagina || "";

  const sezioni = (m.sezioni || []).filter(s => (s.piatti || []).length || (s.extra || []).length);
  document.getElementById("nav").innerHTML = sezioni.map((s, i) =>
    `<a href="#${slug(s.titolo, i)}"${i === 0 ? ' class="active"' : ""}>${esc(s.titolo)}</a>`).join("");

  document.getElementById("menu").innerHTML = sezioni.map((s, i) => `
    <section id="${slug(s.titolo, i)}">
      <div class="section-title">${s.sopratitolo ? `<small>${esc(s.sopratitolo)}</small>` : ""}<h2>${esc(s.titolo)}</h2></div>
      <div class="grid">${(s.piatti || []).map(p => `
        <article class="card${p.disponibile === false ? " off" : ""}">
          <div class="card-head">
            <h3>${esc(p.nome)}</h3>
            <span class="price">${p.disponibile === false ? "Esaurito" : euro(p.prezzo)}</span>
          </div>
          ${(p.ingredienti || []).length ? `<ul class="ingredients">${p.ingredienti.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${p.descrizione ? `<p class="desc">${esc(p.descrizione)}</p>` : ""}
        </article>`).join("")}
      </div>
      ${(s.extra || []).length ? `<div class="extras"><h3>Extra</h3>${s.extra.map(e =>
        `<p>${esc(e.testo)}${e.prezzo !== "" && e.prezzo != null ? ` <strong>${euro(e.prezzo)}</strong>` : ""}</p>`).join("")}</div>` : ""}
    </section>`).join("");

  const links = document.querySelectorAll("nav a");
  const obs = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("section").forEach(s => obs.observe(s));
}

fetch("menu.json?v=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => { document.getElementById("menu").innerHTML = '<p class="loading">Menù momentaneamente non disponibile. Riprova tra poco.</p>'; });
</script>
</body>
</html>
